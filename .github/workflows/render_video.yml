name: LofiMellow HQ Studio Render

on:
  workflow_dispatch:

jobs:
  render-masterpiece:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (FFmpeg & gdown)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install gdown

      - name: Download Video from Google Drive
        run: |
          gdown "https://drive.google.com/uc?id=1sjgS2hc0kxC3IQpFp6Q1M08HXPoLBkmj" -O video.mp4

      - name: Download Audio from Google Drive
        run: |
          gdown "https://drive.google.com/uc?id=16Dti7PUemEg-nuZYAIAx57kJbXLNF_bt" -O audio.mp3

      - name: Render Seamless 2-Hour Video (Remove Watermark & Sync Audio)
        run: |
          ffmpeg -stream_loop -1 -i video.mp4 -i audio.mp3 -filter_complex "[0:v]crop=iw*0.92:ih*0.92:0:0,scale=1920:1080[v]" -map "[v]" -map 1:a -c:v libx264 -preset fast -crf 18 -c:a aac -b:a 320k -shortest -y LofiMellow_HQ_Final.mp4

      - name: Upload Final Masterpiece
        uses: actions/upload-artifact@v4
        with:
          name: LofiMellow_HQ_Final_Render
          path: LofiMellow_HQ_Final.mp4
          
