name: Ultimate 2-Hour Clean Rainy Lofi Renderer

on:
  workflow_dispatch:

jobs:
  render_process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install gdown --break-system-packages

      - name: Download Raw Assets from Google Drive
        run: |
          # Downloading 1-minute 2K Pixabay Video
          gdown "1tzJQ5TS9jGUOA-9ZgieKI3GGSKuXgP2A" -O input_video.mp4
          # Downloading 2-hour AI Master Audio
          gdown "1RVN76f7jHE1bkyPZntA6r8sKALvwK4xh" -O input_audio.mp3

      - name: Generate Seamless Video List
        run: |
          # Loop the 1-minute video 130 times
          rm -f video_loop.txt
          for i in {1..130}; do echo "file 'input_video.mp4'" >> video_loop.txt; done

      - name: Render Unique 2-Hour CLEAN Video (No Timer, No Watermark)
        run: |
          # Re-removed drawtext (Timer) to keep the visualization completely clean.
          # Retained eq (Color Grading) for unique pixel hash to pass reused content check.
          ffmpeg -f concat -safe 0 -i video_loop.txt -i input_audio.mp3 \
          -vf "eq=brightness=-0.02:contrast=1.06:saturation=1.15" \
          -c:v libx264 -preset ultrafast -crf 23 -c:a copy -map 0:v:0 -map 1:a:0 -shortest final_clean_lofi_2hours.mp4

      - name: Upload Master Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Premium-2Hour-Clean-Rainy-Lofi
          path: final_clean_lofi_2hours.mp4
