name: Bulletproof 2-Hour Lofi

on:
  workflow_dispatch:

jobs:
  build_lofi_video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg & gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg
          pip3 install gdown --break-system-packages

      - name: Download Video from Google Drive
        run: |
          gdown "1KOosP8daDFNaPvLTsVVqvtJIrNyR5sIm" -O input_video.mp4

      - name: Create Concat List (The Ultimate Fix for Stutter/Dhakka)
        run: |
          # Creating a list of 100 loops to ensure a smooth, continuous flow without using buggy stream_loop
          rm -f loop.txt
          for i in {1..100}; do echo "file 'input_video.mp4'" >> loop.txt; done

      - name: Render Seamless Loop & Hide Watermark with Timer
        run: |
          # -f concat: Perfectly stitches the video without any lag, pause, or flash.
          # drawtext: Places a solid black box (boxcolor=black@1.0) with a timer EXACTLY over the Veo watermark to hide it completely.
          ffmpeg -f concat -safe 0 -i loop.txt \
          -vf "drawtext=text='%{pts\:hms}': x=w-280: y=h-120: fontsize=65: fontcolor=white: box=1: boxcolor=black@1.0: boxborderw=25" \
          -c:v libx264 -preset ultrafast -crf 23 -c:a aac -b:a 192k -ar 48000 -t 02:00:00 final_lofi_2hours.mp4

      - name: Upload Final Masterpiece
        uses: actions/upload-artifact@v4
        with:
          name: Final-Lofi-Video
          path: final_lofi_2hours.mp4
          
