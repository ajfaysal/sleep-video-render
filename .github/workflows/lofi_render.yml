name: Render Seamless 2-Hour Lofi Fast

on:
  workflow_dispatch:

jobs:
  build_lofi_video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python & Install gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install gdown --break-system-packages

      - name: Install FFmpeg
        run: |
          sudo apt-get install -y ffmpeg

      - name: Download Video from Google Drive
        run: |
          # Downloading the input video from Google Drive
          gdown "1KOosP8daDFNaPvLTsVVqvtJIrNyR5sIm" -O input_video.mp4

      - name: Render Seamless Loop (UltraFast + Zero Lag + UVA)
        run: |
          # Removed heavy unsharp filter to boost speed.
          # Changed preset to 'ultrafast' to force GitHub servers to render at maximum speed.
          # Changed crf to 23 (standard quality) to reduce rendering load.
          ffmpeg -stream_loop -1 -i input_video.mp4 \
          -vf "delogo=x=1150:y=650:w=120:h=60, drawtext=text='%{pts\:hms}': x=w-180: y=h-80: fontsize=36: fontcolor=white@0.6: box=1: boxcolor=black@0.3: boxborderw=10" \
          -c:v libx264 -preset ultrafast -crf 23 -c:a aac -b:a 192k -ar 48000 -vsync 1 -async 1 -t 02:00:00 final_lofi_2hours_fast.mp4

      - name: Upload Final Masterpiece
        uses: actions/upload-artifact@v4
        with:
          name: 2-Hour-Lofi-Video-Fast
          path: final_lofi_2hours_fast.mp4
          
