name: Lofi Video Render

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  render_video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pipx install gdown

      - name: Download Video and Audio
        run: |
          echo "Downloading files from Google Drive..."
          gdown "1Wj6CPrKOmmsc__AVVM0nGNrXpyazBwdP" -O input_video.mp4
          gdown "15-YDwagtDAf9dWLzgeQCEfbHobovKOBA" -O input_audio.mp3

      - name: Render Video with FFmpeg
        run: |
          echo "Starting 2-hour render..."
          ffmpeg -y \
            -stream_loop -1 -i input_video.mp4 \
            -i input_audio.mp3 \
            -filter_complex "[0:v]scale=1920:1080,setpts=PTS-STARTPTS[v]" \
            -map "[v]" \
            -map 1:a \
            -c:v libx264 \
            -preset ultrafast \
            -crf 20 \
            -r 30 \
            -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            -ar 48000 \
            -shortest \
            -metadata title="Cozy Thunderstorm Cabin Lofi" \
            -metadata artist="LofiMellow HQ" \
            -metadata copyright="2026 LofiMellow HQ" \
            -movflags +faststart \
            LofiMellowHQ_Final.mp4

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: LofiMellow-Final-Video
          path: LofiMellowHQ_Final.mp4
          
